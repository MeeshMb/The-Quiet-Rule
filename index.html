var calStore=lsGet("cal",null);
var calY=calStore?calStore.y:null, calM=calStore?calStore.m:null, calSel=calStore?calStore.sel:null;
function saveCal(){lsSet("cal",{y:calY,m:calM,sel:calSel});}
RENDER.fast=function(){
  var now=new Date();
  if(calY===null){calY=now.getFullYear();calM=now.getMonth();}
  if(calSel===null)calSel=todayKey();
  var first=new Date(calY,calM,1);
  var startDow=first.getDay();
  var daysIn=new Date(calY,calM+1,0).getDate();
  var html='<div class="card"><h2>Fasting Calendar</h2>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
    +'<button class="btn ghost" id="calprev">&lt;</button>'
    +'<b class="serif" style="font-size:20px">'+monthName(calM)+' '+calY+'</b>'
    +'<button class="btn ghost" id="calnext">&gt;</button></div>'
    +'<div class="cal">'
    +["S","M","T","W","T","F","S"].map(function(d){return '<div class="dw">'+d+'</div>';}).join("");
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var d=1;d<=daysIn;d++){
    var dt=new Date(calY,calM,d),k=dayKey(dt),f=fastingInfo(dt);
    var cls="";if(k===todayKey())cls+=" today";if(k===calSel)cls+=" sel";
    html+='<button class="'+cls+'" data-day="'+k+'"><span>'+d+'</span><span class="cdot" style="background:'+f.color+'"></span></button>';
  }
  html+='</div><div class="legend">'
    +'<span><span class="cdot" style="background:#C6A13B"></span>No fast</span>'
    +'<span><span class="cdot" style="background:#5E8C76"></span>Fast</span>'
    +'<span><span class="cdot" style="background:#C0805F"></span>Strict</span>'
    +'<span><span class="cdot" style="background:#9FB8C9"></span>Fish allowed</span>'
    +'<span><span class="cdot" style="background:#E8B4A0"></span>Cheesefare</span></div>'
    +'<div id="daydetail"></div></div>';
  /* coming soon */
  var evts=comingEvents();
  html+='<div class="card"><h2>Coming Soon</h2>';
  if(!evts.length)html+='<p class="empty">Nothing special in the next days.</p>';
  evts.slice(0,10).forEach(function(e){
    html+='<div class="eventrow"><span class="ek" style="background:'+e.color+'"></span>'
      +'<span class="ed">'+e.date+'</span><span>'+esc(e.label)+'</span></div>';
  });
  html+='</div>';
  html+='<div class="card"><p class="muted" style="margin:0">Fasting is medicine, not punishment. Begin small and let your priest guide you.</p></div>';
  $("tab-fast").innerHTML=html;
  $("calprev").onclick=function(){calM--;if(calM<0){calM=11;calY--;}saveCal();RENDER.fast();};
  $("calnext").onclick=function(){calM++;if(calM>11){calM=0;calY++;}saveCal();RENDER.fast();};
  document.querySelectorAll("#tab-fast [data-day]").forEach(function(b){
    b.onclick=function(){calSel=b.getAttribute("data-day");saveCal();RENDER.fast();};
  });
  renderDayDetail();
  function renderDayDetail(){
    var dt=parseKey(calSel),f=fastingInfo(dt);
    var mmdd=pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());
    var s=SAINTS[mmdd];
    $("daydetail").innerHTML='<div class="banner" style="margin-bottom:0">'
      +'<b>'+dayName(dt.getDay())+', '+monthName(dt.getMonth())+' '+dt.getDate()+'</b><br>'
      +'<span class="cdot" style="background:'+f.color+';display:inline-block"></span> '
      +esc(f.title)+'. '+esc(f.detail)
      +(s?'<br><span class="serif" style="font-size:16px">'+esc(s.name)+'</span>':'')
      +'</div>';
  }
};
function comingEvents(){
  var out=[],now=new Date(),seen={};
  for(var i=0;i<60;i++){
    var dt=addDays(now,i),k=dayKey(dt),mmdd=pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());
    var label=monthName(dt.getMonth())+" "+dt.getDate();
    var s=SAINTS[mmdd];
    if(s&&s.feast&&!seen["f"+k]){seen["f"+k]=1;out.push({date:label,label:s.name,color:"#C6A13B"});}
    if((mmdd==="01-05"||mmdd==="08-29"||mmdd==="09-14")&&!seen["s"+k]){seen["s"+k]=1;out.push({date:label,label:"Strict fast: "+(s?s.name:""),color:"#C0805F"});}
  }
  [now.getFullYear(),now.getFullYear()+1].forEach(function(y){
    movableFeasts(y).forEach(function(mf){
      var k2=dayKey(mf.date);
      if(k2>=todayKey()&&k2<=dayKey(addDays(now,60))&&!seen["m"+k2]){
        seen["m"+k2]=1;
        var c=mf.kind==="feast"?"#C6A13B":(mf.kind==="strict"?"#C0805F":"#5E8C76");
        out.push({date:monthName(mf.date.getMonth())+" "+mf.date.getDate(),label:mf.label,color:c,sort:k2});
      }
    });
    [["11-15","Nativity Fast begins"],["08-01","Dormition Fast begins"]].forEach(function(p){
      var dt2=new Date(y,+p[0].slice(0,2)-1,+p[0].slice(3,5)),k2=dayKey(dt2);
      if(k2>=todayKey()&&k2<=dayKey(addDays(now,60))&&!seen["p"+k2]){
        seen["p"+k2]=1;
        out.push({date:monthName(dt2.getMonth())+" "+dt2.getDate(),label:p[1],color:"#5E8C76",sort:k2});
      }
    });
  });
  out.sort(function(a,b){
    function sk(e){var m2=e.date.match(/(\w+) (\d+)/);var mi=["January","February","March","April","May","June","July","August","September","October","November","December"].indexOf(m2[1]);var yr=now.getFullYear();var dt2=new Date(yr,mi,+m2[2]);if(dt2<addDays(now,-1))dt2=new Date(yr+1,mi,+m2[2]);return dayKey(dt2);}
    return sk(a)<sk(b)?-1:1;
  });
  return out;
}

    document.body.appendChild(a);a.click();a.remove();
  };
  document.querySelectorAll("[data-jdel]").forEach(function(b){
    b.onclick=function(){es.splice(+b.getAttribute("data-jdel"),1);lsSet("entries",es);renderEntries();};
  });
}
function nameList(key,title,empty){
  var ns=lsGet(key,[]);
  var html='<h3>'+title+'</h3><div>'+(ns.length?ns.map(function(n){
    return '<span class="chip">'+esc(n)+' <a href="#" data-rm="'+esc(n)+'" style="color:var(--terra);text-decoration:none">x</a></span>';
  }).join(""):'<p class="empty">'+empty+'</p>')+'</div>'
    +'<div class="namerow"><input type="text" id="in_'+key+'" placeholder="Add a name"><button id="add_'+key+'">+</button></div>';
  return html;
}
function renderLists(){
  $("jbody").innerHTML='<div class="card"><h2>Prayer Lists</h2><p class="muted">These names appear as gentle reminders in your prayer rule.</p>'
    +'<div id="nliving">'+nameList("names_living","Living","No names yet.")+'</div>'
    +'<div id="ndeparted">'+nameList("names_departed","Departed","No names yet.")+'</div></div>';
  [["names_living"],["names_departed"]].forEach(function(pair){
    var key=pair[0];
    $("add_"+key).onclick=function(){
      var v=$("in_"+key).value.trim();if(!v)return;
      var ns=lsGet(key,[]);ns.push(v);lsSet(key,ns);renderLists();
    };
    $("in_"+key).onkeydown=function(e){if(e.key==="Enter")$("add_"+key).click();};
    document.querySelectorAll("#n"+(key==="names_living"?"living":"departed")+" [data-rm]").forEach(function(a){
      a.onclick=function(ev){
        ev.preventDefault();
        var ns=lsGet(key,[]).filter(function(n){return n!==a.getAttribute("data-rm");});
        lsSet(key,ns);renderLists();
      };
    });
  });
}
function renderConfession(){
  var st=lsGet("confess",{});
  var total=0,done=0;
  CONFESS.forEach(function(g,gi){g.q.forEach(function(q,qi){total++;if(st[gi+"_"+qi])done++;});});
  var html='<div class="card"><h2>Prepare for Confession</h2>'
    +'<p class="muted">A gentle examination, to read slowly before you see your priest. There is no shame here, only honesty.</p>'
    +'<div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>'
    +'<p class="small muted">'+done+' of '+total+'</p>';
  CONFESS.forEach(function(g,gi){
    html+='<h3>'+esc(g.g)+'</h3>';
    g.q.forEach(function(q,qi){
      var id=gi+"_"+qi;
      html+='<label class="confq"><input type="checkbox" data-cq="'+id+'"'+(st[id]?' checked':'')+'><span>'+esc(q)+'</span></label>';
    });
  });
  html+='<p class="muted" style="margin-top:14px">Bring this to your priest in confession. Nothing here leaves your phone.</p>'
    +'<div class="btnrow"><button class="btn ghost" id="confclear">Clear and begin again</button></div></div>';
  $("jbody").innerHTML=html;
  document.querySelectorAll("[data-cq]").forEach(function(c){
    c.onchange=function(){
      var s2=lsGet("confess",{});s2[c.getAttribute("data-cq")]=c.checked;lsSet("confess",s2);renderConfession();
    };
  });
  $("confclear").onclick=function(){lsSet("confess",{});renderConfession();};
}
function fastDaysKept(){
  var n=0,now=new Date();
  for(var i=0;i<90;i++){
    var dt=addDays(now,-i),k=dayKey(dt);
    if(fastingInfo(dt).level>0){
      var w=lsGet("well_"+k,null);
      if(w&&(w.sleep>0||w.water>0||w.mood||w.grat))n++;
      else if(ruleDone("morning",k)||ruleDone("evening",k))n++;
    }
  }
  return n;
}
function renderStats(){
  var ms=ruleStreak("morning"),es2=ruleStreak("evening");
  var rows=[
    ["Morning rule streak",ms+" days"],
    ["Evening rule streak",es2+" days"],
    ["Jesus Prayers prayed",lsGet("rope_total",0)],
    ["Lamps lit",lsGet("lamps",[]).length],
    ["Journal entries",lsGet("entries",[]).length],
    ["Fast days kept, last 90 days",fastDaysKept()]
  ];
  var max=Math.max.apply(null,rows.map(function(r){return +String(r[1]).split(" ")[0]||0;}));
  var html='<div class="card"><h2>Your Journey</h2><p class="muted">Small steps, faithfully kept.</p>';
  rows.forEach(function(r){
    var v=+String(r[1]).split(" ")[0]||0;
    var pct=max?Math.round(v/max*100):0;
    html+='<div class="statrow"><span>'+r[0]+'</span><b>'+r[1]+'</b></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  });
  html+='</div>';
  $("jbody").innerHTML=html;
}
function renderSettings(){
  var html='<div class="card"><h2>Settings</h2>'
    +'<label class="flabel">Your name</label><input type="text" id="setname" value="'+esc(lsGet("name",""))+'" placeholder="For your morning greeting">'
    +'<label class="flabel">Default prayer language</label><div><span class="seg">'
    +'<button data-sl="en" class="'+(defLang()==="en"?'sel':'')+'">English</button>'
    +'<button data-sl="ru" class="'+(defLang()==="ru"?'sel':'')+'">Russian</button></span></div>'
    +'<label class="toggle"><span>Lamp light theme after 8pm</span><input type="checkbox" id="setauto"'+(lsGet("lamp_auto",true)?' checked':'')+'></label>'
    +'<label class="flabel">Access code</label><input type="text" id="setcode" value="'+esc(buyerCode())+'">'
    +'<p class="small muted">This is the code buyers enter to open the app. Change it any time.</p>'
    +'<div class="btnrow"><button class="btn" id="setsave">Save settings</button></div></div>'
    +'<div class="card"><h2>About The Quiet Rule</h2>'
    +'<p class="muted">The Quiet Rule was prepared with love from traditional Orthodox texts, for tired hands and full hearts. Before making it part of your daily rule, please ask your parish priest to look it over.</p>'
    +'<p class="small muted">Made by B&eacute;keStudio with love.</p></div>';
  $("jbody").innerHTML=html;
  document.querySelectorAll("[data-sl]").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll("[data-sl]").forEach(function(x){x.classList.remove("sel");x.removeAttribute("data-pick");});
      b.classList.add("sel");b.setAttribute("data-pick","1");
    };
  });
  $("setauto").onchange=function(){lsSet("lamp_auto",this.checked);applyLamp();};
  $("setsave").onclick=function(){
    lsSet("name",$("setname").value.trim());
    var pick=document.querySelector("[data-sl][data-pick]");
    if(pick)lsSet("lang",pick.getAttribute("data-sl"));
    var c=$("setcode").value.trim();
    if(c)lsSet("code",c);
    renderHeader();renderSettings();
  };
}

</script>
