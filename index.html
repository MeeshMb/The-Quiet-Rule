<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14352A">
<link rel="apple-touch-icon" href="icon-512.png">
<title>The Quiet Rule: Orthodox Prayer and Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#E9F1EA; --blush:#D9E7DC; --sage:#5E8C76; --dsage:#2E5E4E;
  --terra:#C0805F; --gold:#C6A13B; --goldsoft:#E3C878; --ink:#22332B;
  --dgreen:#14352A; --card:#FFFFFF; --line:#D3E0D5; --blue:#9FB8C9;
  --shadow:0 6px 24px rgba(30,70,55,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--cream); color:var(--ink); font-size:16px; line-height:1.55;
}
.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);padding:0 0 110px;position:relative;}
header.top{
  position:sticky;top:0;z-index:40;background:rgba(250,246,240,.96);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:14px 18px 12px;display:flex;align-items:center;gap:12px;
}
.logo{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:var(--dgreen);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.logo svg{width:32px;height:32px;}
/* Orthodox ornament: hero cross medallion, dividers, card title crosses */
.hero{text-align:center;padding:14px 0 4px;}
.herocross{width:92px;height:92px;margin:0 auto;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #2E5E4E, var(--dgreen));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px var(--goldsoft), 0 0 0 6px rgba(198,161,59,.25), var(--shadow);}
.herocross svg{width:52px;height:52px;}
.herocross.sm{width:64px;height:64px;}
.herocross.sm svg{width:36px;height:36px;}
.orndiv{display:flex;align-items:center;gap:10px;margin:18px 8px 6px;}
.orndiv::before,.orndiv::after{content:"";flex:1;height:1px;}
.orndiv::before{background:linear-gradient(90deg,transparent,var(--goldsoft));}
.orndiv::after{background:linear-gradient(90deg,var(--goldsoft),transparent);}
.orndiv svg{width:22px;height:22px;flex:0 0 22px;}
.card>h2{position:relative;padding-left:32px;}
.card>h2::before{content:"";position:absolute;left:0;top:1px;width:22px;height:22px;
  background:url("data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2040%2044%22%3E%3Cg%20fill%3D%22%23C6A13B%22%3E%3Cpath%20d%3D%22M18.8%203L21.2%203L21.8%2041L18.2%2041Z%22%2F%3E%3Cpath%20d%3D%22M12.8%209.7L27.2%209.7L28%209.1L28%2012.5L27.2%2011.9L12.8%2011.9L12%2012.5L12%209.1Z%22%2F%3E%3Cpath%20d%3D%22M9.8%2017.8L30.2%2017.8L31%2017.1L31%2020.9L30.2%2020.2L9.8%2020.2L9%2020.9L9%2017.1Z%22%2F%3E%3Cpath%20d%3D%22M12.9%2030.2L26.5%2026.5L27.1%2028.9L13.6%2032.5Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat center/contain;}
.card>h2.nocross{padding-left:0;}
.card>h2.nocross::before{display:none;}
.brand h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;margin:0;line-height:1;color:var(--dgreen);font-weight:700;}
.brand p{margin:2px 0 0;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dsage);}
.lampbtn{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font-size:13px;color:var(--dsage);cursor:pointer;}
.lampbtn.on{background:var(--dgreen);color:var(--goldsoft);border-color:var(--dgreen);}
.date-line{padding:10px 20px 0;font-size:13px;color:var(--dsage);}
.greet{padding:2px 20px 0;font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;color:var(--ink);font-weight:600;}
.tab{display:none;padding:6px 16px 0;animation:fadeSlide .35s ease;}
.tab.active{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin:14px 0;border:1px solid rgba(234,223,210,.7);}
.card h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;margin:0 0 8px;color:var(--dgreen);font-weight:700;}
.card h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;margin:14px 0 6px;color:var(--dgreen);}
.card p{margin:8px 0;}
.muted{color:var(--dsage);font-size:14px;}
.small{font-size:13px;}
.btn{display:inline-block;border:none;border-radius:999px;padding:12px 22px;font-size:15px;cursor:pointer;
  background:var(--gold);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(194,154,59,.35);}
.btn:active{transform:scale(.97);}
.btn.ghost{background:transparent;color:var(--dsage);box-shadow:none;border:1px solid var(--line);}
.btn.block{width:100%;text-align:center;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
nav.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));
}
nav.bottom button{flex:1;border:none;background:none;cursor:pointer;font-size:11px;color:var(--dsage);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-family:inherit;}
nav.bottom button .ic{font-size:21px;line-height:1;}
nav.bottom button.active{color:var(--terra);font-weight:700;}
.fastbanner{border-radius:18px;padding:14px 16px;margin:14px 0;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);}
.fastbanner .fdot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;}
.fastbanner b{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;display:block;}
.fastbanner span{font-size:13px;color:var(--dsage);}
.saintcard{border:2px solid var(--goldsoft);position:relative;}
.saintcard .feasttag{position:absolute;top:-11px;right:16px;background:var(--gold);color:#fff;font-size:11px;
  padding:3px 12px;border-radius:999px;letter-spacing:1px;text-transform:uppercase;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
.seg button{border:none;background:transparent;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--dsage);font-family:inherit;}
.seg button.sel{background:var(--dsage);color:#fff;}
.prayer{border-top:1px solid var(--line);padding:12px 0;}
.prayer:first-of-type{border-top:none;}
.prow{display:flex;align-items:center;gap:10px;}
.prow .ptitle{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;font-weight:600;color:var(--dgreen);flex:1;}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--sage);background:#fff;cursor:pointer;flex:0 0 26px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;}
.chk.done{background:var(--sage);border-color:var(--sage);}
.ptext{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;line-height:1.65;white-space:pre-wrap;margin:10px 0 4px;color:var(--ink);}
.ptools{display:flex;gap:8px;align-items:center;margin:8px 0 2px;}
.section{border:1px solid var(--line);border-radius:18px;margin:14px 0;background:var(--card);box-shadow:var(--shadow);overflow:hidden;}
.section>button.head{width:100%;border:none;background:var(--blush);padding:15px 18px;cursor:pointer;text-align:left;
  font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:700;color:var(--dgreen);display:flex;justify-content:space-between;align-items:center;font-family:inherit;}
.section .body{display:none;padding:6px 18px 16px;}
.section.open .body{display:block;}
.section .streakline{font-size:13px;color:var(--dsage);}
.chip{display:inline-block;background:var(--blush);border-radius:999px;padding:5px 13px;font-size:13px;margin:3px 4px 3px 0;color:var(--dsage);}
.ropewrap{text-align:center;padding:10px 0;}
.jprayer{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;line-height:1.5;color:var(--dgreen);margin:12px 0;font-weight:600;}
.ring{position:relative;width:190px;height:190px;margin:8px auto;}
.ring svg{transform:rotate(-90deg);}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;font-weight:700;color:var(--dgreen);}
.taparea{margin:14px auto 0;width:100%;max-width:300px;border:none;border-radius:24px;background:var(--gold);color:#fff;
  font-size:20px;font-weight:700;padding:22px;cursor:pointer;box-shadow:0 8px 22px rgba(194,154,59,.4);font-family:inherit;}
.taparea:active{transform:scale(.96);}
.knotrow{display:flex;gap:10px;justify-content:center;margin:12px 0;}
.knotrow button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-size:15px;cursor:pointer;color:var(--dsage);font-family:inherit;}
.knotrow button.sel{background:var(--dgreen);color:#fff;border-color:var(--dgreen);}
.stepper{display:flex;align-items:center;gap:14px;margin:8px 0;}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--terra);}
.stepper .val{font-size:20px;min-width:44px;text-align:center;font-weight:600;}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
textarea{min-height:90px;resize:vertical;}
label.flabel{display:block;font-size:13px;color:var(--dsage);margin:12px 0 4px;letter-spacing:.5px;}
.dots7{display:flex;gap:8px;margin:10px 0 2px;}
.dots7 span{width:16px;height:16px;border-radius:50%;background:var(--line);}
.dots7 span.hit{background:var(--sage);}
.vigil{width:120px;height:150px;margin:6px auto;position:relative;}
.vigil .glass{position:absolute;inset:18px 28px 0;border:2px solid var(--goldsoft);border-radius:14px;background:rgba(194,154,59,.08);}
.vigil .flame{position:absolute;left:50%;top:38px;width:26px;height:52px;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 75%, #fff6d8 0%, #f7c948 38%, #e08a2e 68%, rgba(224,138,46,0) 100%);
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite;}
@keyframes flick{0%,100%{transform:translateX(-50%) scale(1) skewX(0);}25%{transform:translateX(-52%) scale(1.06,1.12) skewX(-3deg);}50%{transform:translateX(-48%) scale(.95,.92) skewX(2deg);}75%{transform:translateX(-51%) scale(1.03,1.07) skewX(-2deg);}}
.vigil .lampbase{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:70px;height:14px;background:var(--gold);border-radius:6px;}
.candle-int{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:18px;text-align:center;color:var(--dsage);margin:6px 0;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:8px 0;}
.cal .dw{font-size:11px;text-align:center;color:var(--dsage);padding:6px 0;letter-spacing:1px;}
.cal button{border:none;background:transparent;border-radius:10px;padding:7px 2px;font-size:14px;cursor:pointer;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;min-height:46px;}
.cal button.dim{color:#c9bda9;}
.cal button.today{background:var(--blush);font-weight:700;}
.cal button.sel{background:var(--dgreen);color:#fff;}
.cal button.sel .cdot{border:1px solid #fff;}
.cdot{width:9px;height:9px;border-radius:50%;}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dsage);margin:8px 0;}
.legend span{display:flex;align-items:center;gap:5px;}
.subtabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto;padding-bottom:4px;}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--dsage);font-family:inherit;}
.subtabs button.sel{background:var(--terra);color:#fff;border-color:var(--terra);}
.jentry{border-top:1px solid var(--line);padding:12px 0;}
.jentry .jt{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;font-weight:600;color:var(--dgreen);}
.jentry .jd{font-size:12px;color:var(--dsage);}
.jentry .jb{white-space:pre-wrap;margin-top:6px;}
.del{border:none;background:none;color:var(--terra);cursor:pointer;font-size:13px;padding:4px 0;font-family:inherit;}
.namerow{display:flex;gap:8px;margin:8px 0;align-items:center;}
.namerow input{flex:1;}
.namerow button{border:none;background:var(--sage);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 38px;}
.confq{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer;}
.confq input{width:20px;height:20px;margin-top:2px;accent-color:var(--sage);flex:0 0 20px;}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 12px;}
.bar i{display:block;height:100%;background:var(--sage);border-radius:999px;}
.statrow{display:flex;justify-content:space-between;font-size:14px;margin:8px 0;}
.statrow b{font-size:17px;color:var(--dgreen);}
.devo-step{display:none;animation:fadeSlide .35s ease;}
.devo-step.on{display:block;}
.devo-nav{display:flex;gap:10px;margin-top:12px;}
.banner{background:var(--blush);border-radius:14px;padding:12px 15px;font-size:14px;margin:12px 0;color:var(--dsage);}
.banner b{color:var(--terra);}

.lockwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, rgba(6,20,15,.12) 40%, rgba(6,20,15,.55) 100%);}
.lockinner{position:relative;z-index:1;width:100%;max-width:360px;text-align:center;}
.lockring{width:118px;height:118px;margin:0 auto 20px;border:3px solid #C6A13B;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:rgba(8,26,20,.5);
  box-shadow:0 0 44px rgba(198,161,59,.28), inset 0 0 24px rgba(0,0,0,.4);}
.lockring svg{width:54px;height:58px;}
.lockcard{position:relative;background:#F8F1DF;border-radius:16px;padding:42px 30px 34px;
  border:1px solid #C6A13B;outline:1px solid rgba(198,161,59,.65);outline-offset:6px;
  box-shadow:0 24px 70px rgba(0,0,0,.5);}
.lockcard h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:46px;margin:0;color:#14352A;letter-spacing:2px;font-weight:600;}
.lockdiv{display:flex;align-items:center;gap:10px;margin:12px 4px 14px;}
.lockdiv .ln{flex:1;height:2px;}
.lockdiv .ln.l{background:linear-gradient(90deg,transparent,#C6A13B);}
.lockdiv .ln.r{background:linear-gradient(90deg,#C6A13B,transparent);}
.lockdiv svg{width:22px;height:24px;flex:none;}
.lockcard p{color:#2E5E4E;font-size:16px;font-family:Georgia,serif;line-height:1.5;margin:0 0 6px;}
.lockcard input{text-align:center;letter-spacing:4px;font-size:20px;margin:14px 0 4px;width:100%;
  border:2px solid #C6A13B;border-radius:999px;padding:13px 16px;background:#FFFDF6;color:#14352A;
  font-family:Georgia,serif;box-sizing:border-box;}
.lockcard input::placeholder{color:#9AA392;letter-spacing:6px;}
.lockcard input:focus{outline:2px solid #C6A13B;outline-offset:2px;border-color:#C6A13B;}
.lockopen{margin-top:14px;background:linear-gradient(180deg,#DDBB60,#B8892E);border:none;border-radius:999px;
  font-size:21px;padding:15px;font-family:Georgia,serif;letter-spacing:1px;
  box-shadow:0 8px 22px rgba(184,137,46,.4);}
.lockmsg{color:#B0563E;font-size:14px;min-height:22px;}
.corner{position:absolute;width:46px;height:46px;pointer-events:none;}
.corner.tl{top:10px;left:10px;}
.corner.tr{top:10px;right:10px;transform:scaleX(-1);}
.corner.bl{bottom:10px;left:10px;transform:scaleY(-1);}
.corner.br{bottom:10px;right:10px;transform:scale(-1,-1);}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px;}
.toggle input{width:22px;height:22px;accent-color:var(--sage);}
.eventrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;}
.eventrow .ed{font-size:12px;color:var(--dsage);min-width:86px;}
.eventrow .ek{width:10px;height:10px;border-radius:50%;flex:0 0 10px;}
.empty{color:var(--dsage);font-style:italic;font-size:14px;}
/* Lamp light evening theme */
body.lamp{background:#1a2822;}
body.lamp .app{background:#1a2822;}
body.lamp header.top{background:rgba(26,40,34,.96);border-color:#33463c;}
body.lamp .brand h1{color:var(--goldsoft);}
body.lamp .greet{color:#f2e9d8;}
body.lamp .card,body.lamp .section{background:#24382f;border-color:#33463c;color:#e8dfcd;}
body.lamp .card h2,body.lamp .card h3,body.lamp .section>button.head,body.lamp .prow .ptitle{color:var(--goldsoft);}

/* ============================================================

const BUYER_CODE_DEFAULT = "AMEN29";
/* Saint of the day, New Calendar menologion.
   One primary commemoration per day. Great Feasts are marked feast:true.
   Copy rule: no em dashes, no en dashes, no hyphenated compounds in user visible text. */

const SAINTS = {
"01-01": { name: "Saint Basil the Great", title: "Archbishop of Caesarea", note: "One of the Three Holy Hierarchs, a father of monastic life. The Church also celebrates the Circumcision of Christ today." },
"01-02": { name: "Saint Seraphim of Sarov", title: "Wonderworker", note: "The gentle elder of Sarov who greeted every visitor with Christ is risen. His relics were found incorrupt." },
"01-03": { name: "Holy Prophet Malachi", title: "Prophet", note: "The last of the twelve minor prophets, who foretold the coming of the Forerunner." },
"01-04": { name: "The Seventy Apostles", title: "Synaxis", note: "The seventy disciples sent out by Christ two by two, remembered together today." },
"01-05": { name: "Eve of Theophany", title: "Strict fast day", note: "A day of strict fasting as the Church prepares for the Baptism of Christ. Martyrs Theopemptus and Theonas are also remembered." },
"01-06": { name: "Theophany", title: "Great Feast", feast: true, note: "The Baptism of our Lord in the Jordan, when the Trinity was made manifest. Holy water is blessed in every parish today." },
"01-07": { name: "Saint John the Baptist", title: "Forerunner", note: "The day after Theophany the Church honors the holy Forerunner who baptized Christ." },
"01-08": { name: "Saint George the Chozebite", title: "Monk", note: "A humble monk of the Judean desert, known for his tears and his love of the psalms." },
"01-09": { name: "Martyr Polyeuctus", title: "Martyr", note: "A Roman soldier who tore up the imperial decree against Christians and confessed Christ boldly." },
"01-10": { name: "Saint Gregory of Nyssa", title: "Bishop", note: "Brother of Saint Basil, a great theologian of the Trinity and of the spiritual life." },
"01-11": { name: "Saint Theodosius the Great", title: "Monk", note: "Founder of the great coenobitic monastery near Bethlehem, father of communal monastic life." },
"01-12": { name: "Martyr Tatiana of Rome", title: "Virgin Martyr", note: "A deaconess of Rome who suffered under Alexander Severus and is beloved by students." },
"01-13": { name: "Martyrs Hermylus and Stratonicus", title: "Martyrs", note: "Two friends in the imperial guard who were drowned together for confessing Christ." },
"01-14": { name: "Saint Sava of Serbia", title: "Enlightener of Serbia", note: "First Archbishop of Serbia, who gave his people an Orthodox Church and crown." },
"01-15": { name: "Saint Paul of Thebes", title: "Hermit", note: "The first hermit, who lived ninety years in the Egyptian desert, fed by ravens." },
"01-16": { name: "The Chains of Saint Peter", title: "Feast", note: "The Church honors the precious chains with which the Apostle Peter was bound." },
"01-17": { name: "Saint Anthony the Great", title: "Father of Monks", note: "The founder of desert monasticism, whose life by Saint Athanasius set the pattern for all monks." },
"01-18": { name: "Saint Athanasius the Great", title: "Archbishop of Alexandria", note: "Defender of the faith against Arianism. Saint Cyril of Alexandria is honored with him." },
"01-19": { name: "Saint Macarius the Great", title: "Monk of Egypt", note: "A disciple of Saint Anthony, radiant with humility and the gift of discernment." },
"01-20": { name: "Saint Euthymius the Great", title: "Monk", note: "A great organizer of desert monasticism in Palestine, called the Great for his holiness." },
"01-21": { name: "Saint Maximus the Confessor", title: "Confessor", note: "Defender of the two wills of Christ, who suffered exile and mutilation for the true faith." },
"01-22": { name: "Saint Timothy", title: "Apostle", note: "Beloved disciple of Saint Paul and first Bishop of Ephesus. Martyr Anastasius the Persian is also remembered." },
"01-23": { name: "Saint Clement of Ancyra", title: "Hieromartyr", note: "A bishop who endured twenty eight years of tortures under many emperors without denying Christ." },
"01-24": { name: "Saint Xenia of Saint Petersburg", title: "Fool for Christ", note: "After her husband died she gave away everything and wandered the city praying for all." },
"01-25": { name: "Saint Gregory the Theologian", title: "Archbishop of Constantinople", note: "The Theologian, whose five orations on God are treasured as the height of Orthodox teaching." },
"01-26": { name: "Saint Xenophon and his family", title: "Monks", note: "A senator of Constantinople who with his wife and two sons left the world for the monastic life." },
"01-27": { name: "Saint John Chrysostom", title: "Translation of relics", note: "Today his holy relics were brought back to Constantinople. The Golden Mouth, preacher of repentance." },
"01-28": { name: "Saint Ephraim the Syrian", title: "Monk and hymn writer", note: "The harp of the Holy Spirit, whose hymns and prayers are sung in every Lent." },

"02-01": { name: "Martyr Tryphon", title: "Martyr", note: "A young gooseherd whose prayers cast out demons. The Church begins the forefeast of the Meeting today." },

"02-05": { name: "Martyr Agatha", title: "Virgin Martyr", note: "Of Sicily, who endured terrible tortures with unshaken courage and is honored as a protector." },
"02-06": { name: "Saint Photius", title: "Patriarch of Constantinople", note: "The great scholar patriarch, defender of the faith and enlightener of the Slavs through his disciples." },
"02-07": { name: "Saint Parthenius", title: "Bishop of Lampsacus", note: "Known for his gift of healing and his mercy to the poor." },
"02-08": { name: "Saint Theodore Stratelates", title: "Great Martyr", note: "The General, a commander who confessed Christ before the emperor Licinius. The Prophet Zechariah is also remembered." },
"02-09": { name: "Martyr Nicephorus", title: "Martyr", note: "Who forgave his friend from the heart and received the crown of martyrdom." },
"02-10": { name: "Saint Haralambos", title: "Hieromartyr", note: "A priest of Magnesia, martyred at the age of one hundred and thirteen, steadfast to the end." },
"02-11": { name: "Saint Blaise of Sebaste", title: "Hieromartyr", note: "Bishop and healer, protector of flocks and throats, martyred under Licinius." },
"02-12": { name: "Saint Meletius", title: "Archbishop of Antioch", note: "A peacemaker among bishops, who showed the Trinity with three fingers and one blessing." },
"02-13": { name: "Saint Martinian", title: "Monk", note: "Who fled temptation to a rock in the sea and lived there in prayer for many years." },
"02-14": { name: "Saint Cyril", title: "Equal to the Apostles", note: "With his brother Methodius he gave the Slavs an alphabet and the Gospel in their own tongue." },
"02-15": { name: "Saint Onesimus", title: "Apostle", note: "The runaway slave whom Saint Paul returned to Philemon as a beloved brother in Christ." },
"02-16": { name: "Saint Pamphilus and companions", title: "Martyrs", note: "A learned priest of Caesarea who copied the Scriptures by hand, martyred with eleven companions." },
"02-17": { name: "Saint Theodore Tyro", title: "Great Martyr", note: "The Recruit, a young soldier burned for Christ. His miracle of the kolyva is remembered in Lent." },
"02-18": { name: "Saint Leo the Great", title: "Pope of Rome", note: "Defender of the faith at Chalcedon, whose Tome was acclaimed by the fathers." },
"02-19": { name: "Saints Archippus, Philemon and Apphia", title: "Apostles", note: "Fellow workers of Saint Paul, who kept the church in their house." },
"02-20": { name: "Saint Leo of Catania", title: "Bishop", note: "A wonderworker who burned a sorcerer with prayer and protected his flock." },
"02-21": { name: "Saint Timothy of Symbola", title: "Monk", note: "A quiet ascetic of Mount Olympus, known for his gentleness and miracles." },
"02-22": { name: "The Martyrs of Eugenius", title: "Martyrs", note: "Whose relics were uncovered at Eugenius near Constantinople and gave forth healings." },
"02-23": { name: "Saint Polycarp of Smyrna", title: "Hieromartyr", note: "Disciple of Saint John the Theologian, burned at eighty six, steadfast in the faith of his baptism." },
"02-24": { name: "Saint John the Baptist", title: "Finding of his Head", note: "The first and second finding of the precious head of the Forerunner." },
"02-25": { name: "Saint Tarasius", title: "Patriarch of Constantinople", note: "Who presided at the Seventh Ecumenical Council and restored the holy icons." },
"02-26": { name: "Saint Porphyrius of Gaza", title: "Bishop", note: "Who turned a pagan city to Christ through prayer, patience and almsgiving." },
"02-27": { name: "Saint Procopius the Confessor", title: "Confessor", note: "A monk who suffered for the holy icons under the iconoclast emperors." },
"02-28": { name: "Saint John Cassian", title: "Monk", note: "The Roman monk of the Egyptian desert whose writings shaped monastic life in the West. Remembered today in non leap years." },
"02-29": { name: "Saint John Cassian", title: "Monk", note: "The Roman monk of the Egyptian desert whose Conferences and Institutes guide monastics to this day." },

"03-01": { name: "Martyr Eudokia", title: "Martyr", note: "Of Heliopolis, who turned from a sinful life to martyrdom for Christ." },
"03-02": { name: "Martyr Hesychius", title: "Martyr", note: "A palace guard who refused to deny Christ and was drowned for his faith." },
"03-03": { name: "Saints Eutropius, Cleonicus and Basiliscus", title: "Martyrs", note: "Kinsmen of Saint Theodore Tyro, crucified together for Christ." },
"03-04": { name: "Saint Gerasimus of the Jordan", title: "Monk", note: "The abbot whose lion companion is remembered in every icon of his life." },
"03-05": { name: "Martyr Conon", title: "Martyr", note: "A gardener of Nazareth who confessed Christ before the governor with simple courage." },
"03-06": { name: "The Forty two Martyrs of Amorium", title: "Martyrs", note: "Commanders taken captive by the Saracens, who refused to deny Christ and were beheaded." },
"03-07": { name: "Hieromartyrs of Cherson", title: "Bishops", note: "Basil, Ephraim, Capito and their companions, who brought the Gospel to the Crimea." },
"03-08": { name: "Saint Theophylact", title: "Bishop of Nicomedia", note: "A confessor of the holy icons, exiled for defending their veneration." },
"03-09": { name: "The Forty Martyrs of Sebaste", title: "Martyrs", note: "Soldiers who stood naked on a frozen lake for Christ. Their memory falls in Great Lent." },
"03-10": { name: "Martyr Quadratus of Corinth", title: "Martyr", note: "With his companions, beheaded for refusing to sacrifice to idols." },
"03-11": { name: "Saint Sophronius", title: "Patriarch of Jerusalem", note: "Defender of the faith and poet of the holy city." },
"03-12": { name: "Saint Gregory the Dialogist", title: "Pope of Rome", note: "Gregory the Great, whose Liturgy of the Presanctified Gifts is served in Lent." },
"03-13": { name: "Saint Nicephorus", title: "Translation of relics", note: "Patriarch of Constantinople, confessor of the holy icons, whose relics were found incorrupt." },
"03-14": { name: "Saint Benedict of Nursia", title: "Monk", note: "Father of Western monasticism, whose rule breathed the spirit of the desert." },
"03-15": { name: "Martyr Agapius and companions", title: "Martyrs", note: "Of Caesarea, who went joyfully to martyrdom in the persecution of Diocletian." },
"03-16": { name: "Martyr Sabinus", title: "Martyr", note: "Of Egypt, who was drowned for confessing Christ before the governor." },

"03-18": { name: "Saint Cyril of Jerusalem", title: "Archbishop", note: "Whose catechetical lectures still teach every convert the faith." },
"03-19": { name: "Saints Chrysanthus and Daria", title: "Martyrs", note: "A noble couple of Rome who turned their home into a church and suffered together." },
"03-20": { name: "The Fathers of Saint Sabbas", title: "Martyrs", note: "The monks of the Lavra of Saint Sabbas, slain by the Saracens for Christ." },
"03-21": { name: "Saint James the Confessor", title: "Bishop of Catania", note: "Who suffered exile for the holy icons." },
"03-22": { name: "Saint Basil of Ancyra", title: "Hieromartyr", note: "A priest martyred under Julian the Apostate for defending the faith." },
"03-23": { name: "Martyr Nikon and disciples", title: "Martyrs", note: "Two hundred monks slain with their abbot in Sicily." },
"03-24": { name: "Forefeast of the Annunciation", title: "Forefeast", note: "The Church begins to sing of the good tidings to the Virgin. Saint Artemon is also remembered." },
"03-25": { name: "The Annunciation", title: "Great Feast", feast: true, note: "The Archangel Gabriel announces to the Virgin that she will bear the Son of God. Fish is allowed today." },
"03-26": { name: "Archangel Gabriel", title: "Synaxis", note: "The day after the Annunciation honors the archangel who brought the good tidings." },
"03-27": { name: "Martyr Matrona of Thessalonica", title: "Martyr", note: "A servant girl beaten for her faith in Christ, who died praying." },
"03-28": { name: "Saint Hilarion the New", title: "Abbot", note: "Of the Dalmatus monastery, a confessor of the holy icons." },
"03-29": { name: "Saint Mark of Arethusa", title: "Hieromartyr", note: "An aged bishop who forgave his torturers even as they tormented him." },
"03-30": { name: "Saint John Climacus", title: "Abbot of Sinai", note: "Author of the Ladder of Divine Ascent, read in every monastery during Lent." },
"03-31": { name: "Saint Hypatius of Gangra", title: "Hieromartyr", note: "A bishop struck down on the road for his Orthodox faith." },

"04-01": { name: "Saint Mary of Egypt", title: "Penitent", note: "From a life of sin to forty seven years of repentance in the desert. Her life is read in Lent." },
"04-02": { name: "Saint Titus the Wonderworker", title: "Monk", note: "A gentle abbot known for his miracles and his love of peace." },
"04-03": { name: "Saint Nicetas the Confessor", title: "Abbot", note: "Who suffered imprisonment for the holy icons under Leo the Armenian." },
"04-04": { name: "Saint Joseph the Hymnographer", title: "Hymn writer", note: "Whose canons fill the services of Lent and the feasts." },
"04-05": { name: "Martyrs Theodulus and Agathopodes", title: "Martyrs", note: "Deacons of Thessalonica, drowned with stones around their necks for Christ." },
"04-06": { name: "Saint Eutychius", title: "Patriarch of Constantinople", note: "A defender of the faith, exiled and restored, known for his humility." },
"04-07": { name: "Saint George of Mytilene", title: "Bishop", note: "A confessor of the holy icons under the iconoclasts." },
"04-08": { name: "The Apostles of the Seventy", title: "Apostles", note: "Herodion, Agabus, Asyncritus, Rufus, Phlegon and Hermes, fellow workers of Saint Paul." },
"04-09": { name: "Martyr Eupsychius", title: "Martyr", note: "Of Caesarea, beheaded under Julian the Apostate for destroying a pagan temple." },
"04-10": { name: "Martyrs Terence, Pompeius and companions", title: "Martyrs", note: "Forty Christians of Carthage who suffered together under Decius." },
"04-11": { name: "Saint Antipas", title: "Hieromartyr", note: "Bishop of Pergamum, burned in a bronze bull, praised in the Revelation of Saint John." },
"04-12": { name: "Saint Basil the Confessor", title: "Bishop of Parium", note: "Who defended the holy icons and suffered for them." },
"04-13": { name: "Saint Martin the Confessor", title: "Pope of Rome", note: "Who suffered exile for defending the two wills of Christ." },
"04-14": { name: "Saints Aristarchus, Pudens and Trophimus", title: "Apostles", note: "Of the Seventy, companions of Saint Paul in his journeys and trials." },
"04-15": { name: "Saint Crescens", title: "Martyr", note: "Of Myra, who confessed Christ before the governor and received the crown." },
"04-16": { name: "Martyrs Agape, Irene and Chionia", title: "Virgin Martyrs", note: "Three sisters of Thessalonica, burned for keeping the holy books of the Church." },
"04-17": { name: "Saint Simeon of Persia", title: "Hieromartyr", note: "A bishop who with his flock refused to worship the sun and was martyred." },
"04-18": { name: "Saint John of Decapolis", title: "Monk", note: "A disciple of Saint Gregory of Decapolis, steadfast in ascetic labor." },
"04-19": { name: "Saint John of the Ancient Caves", title: "Monk", note: "A silent ascetic of Palestine, known for his deep humility." },
"04-20": { name: "Saint Theodore Trichinas", title: "Monk", note: "Called the Hairshirt wearer, a wonderworker of Constantinople." },
"04-21": { name: "Saint Januarius and companions", title: "Hieromartyrs", note: "Bishop of Benevento, whose blood still liquefies in Naples as a sign." },
"04-22": { name: "Saint Theodore the Sykeote", title: "Bishop", note: "A wonderworker from childhood, later Bishop of Anastasiopolis." },
"04-23": { name: "Saint George", title: "Great Martyr", note: "The Victory bearer, patron of soldiers and of many nations. If this falls in Lent it is kept on Bright Monday." },
"04-24": { name: "Martyr Sabbas the General", title: "Martyr", note: "A Goth commander who confessed Christ before his own people and was drowned." },
"04-25": { name: "Saint Mark", title: "Apostle and Evangelist", note: "Author of the second Gospel, founder of the Church of Alexandria." },
"04-26": { name: "Saint Basil of Amasea", title: "Hieromartyr", note: "A bishop beheaded under Licinius for his faith." },
"04-27": { name: "Saint Simeon", title: "Apostle", note: "The kinsman of the Lord, second Bishop of Jerusalem, crucified at one hundred and twenty." },
"04-28": { name: "Saints Jason and Sosipater", title: "Apostles", note: "Of the Seventy, who brought the Gospel to Corfu." },
"04-29": { name: "The Nine Martyrs of Cyzicus", title: "Martyrs", note: "From many lands, united in one confession of Christ." },
"04-30": { name: "Saint James", title: "Apostle", note: "Son of Zebedee, brother of Saint John, the first apostle to be martyred." },

"05-01": { name: "Holy Prophet Jeremiah", title: "Prophet", note: "The weeping prophet, who foretold the new covenant written on the heart." },
"05-02": { name: "Saint Athanasius the Great", title: "Archbishop of Alexandria", note: "Remembered on the day of his repose, the champion of Nicaea and defender of Christ divinity." },
"05-03": { name: "Saints Timothy and Maura", title: "Martyrs", note: "Newlyweds of Egypt who suffered together twenty days after their wedding." },
"05-04": { name: "Martyr Pelagia of Tarsus", title: "Virgin Martyr", note: "Who chose a brazen bull heated with fire over denying Christ." },
"05-05": { name: "Saint Irene", title: "Great Martyr", note: "A princess who became an apostle to her own people and suffered greatly for Christ." },
"05-06": { name: "Saint Job", title: "The Long Suffering", note: "The righteous Job, whose patience under affliction is remembered by the whole Church." },
"05-07": { name: "Saint Alexis Toth", title: "Confessor", note: "Who led thousands of Uniates back to Orthodoxy in America through his preaching and love." },
"05-08": { name: "Saint John the Theologian", title: "Apostle", note: "The beloved disciple, author of the fourth Gospel. Saint Arsenius the Great is also remembered." },
"05-09": { name: "Prophet Isaiah", title: "Prophet", note: "Who saw the Lord high and lifted up and foretold the Virgin birth. Saint Christopher the Martyr is also remembered." },
"05-10": { name: "Saint Simon the Zealot", title: "Apostle", note: "One of the Twelve, who preached the Gospel in many lands." },
"05-11": { name: "Saints Cyril and Methodius", title: "Equals to the Apostles", note: "The brothers who gave the Slavic peoples the alphabet, the Liturgy and the Gospel." },
"05-12": { name: "Saint Epiphanius of Cyprus", title: "Bishop", note: "A defender of the faith against heresies, known for his learning and miracles." },
"05-13": { name: "Martyr Glyceria", title: "Virgin Martyr", note: "Of Heraclea, who smashed the statue of Zeus with her prayers and was martyred." },
"05-14": { name: "Martyr Isidore of Chios", title: "Martyr", note: "A soldier from Alexandria who confessed Christ on the island of Chios." },
"05-15": { name: "Saint Pachomius the Great", title: "Monk", note: "Founder of communal monasticism in Egypt, who received his rule from an angel." },
"05-16": { name: "Saint Theodore the Sanctified", title: "Monk", note: "The first disciple of Saint Pachomius, sanctified by obedience." },
"05-17": { name: "Saints Andronicus and Junia", title: "Apostles", note: "Of the Seventy, praised by Saint Paul as outstanding among the apostles." },
"05-18": { name: "Martyr Theodotus of Ancyra", title: "Martyr", note: "An innkeeper who buried the bodies of martyred virgins and was martyred himself." },
"05-19": { name: "Saint Patrick of Prusa", title: "Hieromartyr", note: "A bishop thrown into hot springs for refusing to sacrifice to idols." },
"05-20": { name: "Martyr Thalleleus", title: "Martyr", note: "A young physician of Lebanon who healed in the name of Christ and was martyred." },
"05-21": { name: "Saints Constantine and Helen", title: "Equals to the Apostles", note: "The emperor who gave the Church peace and his mother who found the precious Cross." },
"05-22": { name: "Martyr Basiliscus", title: "Martyr", note: "Nephew of Saint Theodore Tyro, beheaded for Christ under Maximian." },
"05-23": { name: "Saint Michael the Confessor", title: "Bishop of Synnada", note: "Who suffered for the holy icons under Leo the Armenian." },
"05-24": { name: "Saint Simeon of the Wonderful Mountain", title: "Stylite", note: "Who lived atop a pillar in Syria, a beacon of prayer for all who came." },
"05-25": { name: "Saint John the Baptist", title: "Third Finding of his Head", note: "The precious head of the Forerunner, found again and honored by the Church." },
"05-26": { name: "Saint Carpus", title: "Apostle", note: "Of the Seventy, Bishop of Beroea in Thrace, fellow worker of Saint Paul." },
"05-27": { name: "Saint John the Russian", title: "Confessor", note: "A prisoner of war in Turkey whose humble holiness converted his captors." },
"05-28": { name: "Saint Nicetas of Chalcedon", title: "Bishop", note: "A confessor of the holy icons under Leo the Armenian." },
"05-29": { name: "Martyr Theodosia of Tyre", title: "Virgin Martyr", note: "Eighteen years old, who comforted confessors in prison and was martyred." },
"05-30": { name: "Saint Isaacius", title: "Founder", note: "Of the Dalmatian monastery in Constantinople, a defender of the faith." },
"05-31": { name: "Martyr Hermias", title: "Martyr", note: "An aged soldier who endured terrible tortures with thanksgiving and was beheaded." },

"06-01": { name: "Saint Justin the Philosopher", title: "Martyr", note: "The great apologist who showed that Christ is the Logos known dimly even by the philosophers." },
"06-02": { name: "Saint Nicephorus the Confessor", title: "Patriarch of Constantinople", note: "Who defended the holy icons and died in exile for them." },
"06-03": { name: "Saints Lucillian and companions", title: "Martyrs", note: "A pagan priest converted in old age, martyred with four young men." },
"06-04": { name: "Saint Metrophanes", title: "Patriarch of Constantinople", note: "The first Archbishop of Byzantium, who blessed Saint Constantine." },
"06-05": { name: "Saint Dorotheus of Tyre", title: "Hieromartyr", note: "A learned bishop of one hundred and seven years, martyred under Julian." },
"06-06": { name: "Saint Hilarion the New", title: "Abbot", note: "Of Dalmatus monastery, who healed the sick and cast out demons by prayer." },
"06-07": { name: "Saint Theodotus of Cyrenia", title: "Hieromartyr", note: "Bishop of Cyprus, who suffered under Licinius for confessing Christ." },
"06-08": { name: "Saint Theodore Stratelates", title: "Translation of relics", note: "The Great Martyr, whose relics were translated with great honor." },
"06-09": { name: "Saint Cyril of Alexandria", title: "Archbishop", note: "Remembered on the day of his repose, the defender of the Theotokos at Ephesus." },
"06-10": { name: "Saint Timothy of Prusa", title: "Hieromartyr", note: "A bishop martyred for Christ under Julian the Apostate." },
"06-11": { name: "Saints Bartholomew and Barnabas", title: "Apostles", note: "Bartholomew of the Twelve and Barnabas the son of consolation, honored together." },
"06-12": { name: "Saint Onuphrius the Great", title: "Hermit", note: "Who lived sixty years alone in the desert, clothed only in his hair. Saint Peter of Athos is also remembered." },
"06-13": { name: "Martyr Aquilina", title: "Virgin Martyr", note: "Twelve years old, who confessed Christ before the governor of Byblos." },
"06-14": { name: "Prophet Elisha", title: "Prophet", note: "Disciple of Elijah, who received a double portion of his spirit. Saint Methodius of Constantinople is also remembered." },
"06-15": { name: "Prophet Amos", title: "Prophet", note: "The herdsman of Tekoa called to prophesy. Saint Jonah of Moscow is also remembered." },
"06-16": { name: "Saint Tychon of Amathus", title: "Bishop", note: "A wonderworker of Cyprus, protector of vineyards and the poor." },
"06-17": { name: "Saints Manuel, Sabel and Ishmael", title: "Martyrs", note: "Persian ambassadors who refused to deny Christ before Julian the Apostate." },
"06-18": { name: "Martyr Leontius of Tripoli", title: "Martyr", note: "A soldier whose courage converted his own torturers." },
"06-19": { name: "Saint Jude", title: "Apostle", note: "Thaddeus, brother of the Lord, author of the shortest epistle, helper in desperate causes." },
"06-20": { name: "Saint Methodius of Patara", title: "Hieromartyr", note: "Bishop of Olympus, a learned defender of the faith, martyred under Diocletian." },
"06-21": { name: "Martyr Julian of Tarsus", title: "Martyr", note: "A young man sewn in a sack with serpents and cast into the sea for Christ." },
"06-22": { name: "Saint Eusebius of Samosata", title: "Hieromartyr", note: "A bishop who traveled in disguise to ordain Orthodox clergy under Arian persecution." },
"06-23": { name: "Martyr Agrippina of Rome", title: "Virgin Martyr", note: "Whose relics, carried to Sicily, gave forth many healings." },
"06-24": { name: "Nativity of Saint John the Baptist", title: "Great Feast", feast: true, note: "The birth of the Forerunner, foretold by the angel to the aged Zechariah." },
"06-25": { name: "Martyr Febronia of Nisibis", title: "Virgin Martyr", note: "A beautiful nun who chose torture over denying her Bridegroom Christ." },
"06-26": { name: "Saint David of Thessalonica", title: "Monk", note: "Who lived in an almond tree for three years in prayer, then in a cell." },
"06-27": { name: "Saint Sampson the Hospitable", title: "Monk", note: "A physician of Constantinople who built a hospital for the poor." },
"06-28": { name: "Saints Cyrus and John", title: "Translation of relics", note: "The unmercenary healers, whose relics were translated to Rome." },
"06-29": { name: "Saints Peter and Paul", title: "Chief Apostles", feast: true, note: "The two pillars of the Church, martyred in Rome. The Apostles Fast ends with their feast." },
"06-30": { name: "The Twelve Holy Apostles", title: "Synaxis", note: "The day after Peter and Paul, the Church honors all twelve together." },

"07-01": { name: "Saints Cosmas and Damian", title: "Unmercenaries of Rome", note: "The holy physicians who healed without payment, martyred under Diocletian." },
"07-02": { name: "The Robe of the Theotokos", title: "Feast", note: "The placing of her precious robe in the church of Blachernae in Constantinople." },
"07-03": { name: "Martyr Hyacinth", title: "Martyr", note: "A young courtier who refused the emperor idolatrous food and was starved for Christ." },
"07-04": { name: "Saint Andrew of Crete", title: "Archbishop", note: "Author of the Great Canon of repentance, sung in the first week of Lent." },
"07-05": { name: "Saint Athanasius of Athos", title: "Monk", note: "Founder of the Great Lavra, who organized monastic life on the Holy Mountain." },
"07-06": { name: "Saint Sisoes the Great", title: "Monk", note: "Of Scetis, whose humility was so deep that even the demons could not approach him." },
"07-07": { name: "Saints Thomas and Acacius", title: "Martyrs of Sinai", note: "With Saint Eudokia, witnesses of Christ in the desert." },
"07-08": { name: "Great Martyr Procopius", title: "Great Martyr", note: "A persecutor converted by a vision of the Cross, who became a bold confessor." },
"07-09": { name: "Saint Pancratius of Taormina", title: "Hieromartyr", note: "Disciple of Saint Peter, first Bishop of Taormina in Sicily." },
"07-10": { name: "The Forty five Martyrs of Nicopolis", title: "Martyrs", note: "Of Armenia, who suffered together under Licinius." },
"07-11": { name: "Saint Olga", title: "Equal to the Apostles", note: "Princess of Russia, grandmother of Saint Vladimir, who brought the faith to Kiev." },
"07-12": { name: "Martyrs Proclus and Hilary", title: "Martyrs", note: "Uncle and nephew, who suffered together for Christ under Trajan." },
"07-13": { name: "Archangel Gabriel", title: "Synaxis", note: "The Church honors the archangel of the Annunciation with a special synaxis." },
"07-14": { name: "Saint Aquila", title: "Apostle", note: "Of the Seventy, tentmaker with Saint Paul, host of the church in his house." },
"07-15": { name: "Saint Vladimir", title: "Equal to the Apostles", note: "Baptizer of Rus, whose choice of Orthodoxy shaped a thousand years of faith." },
"07-16": { name: "Saint Athenogenes", title: "Hieromartyr", note: "Bishop of Sebaste, who with ten disciples sang a hymn as they went to martyrdom." },
"07-17": { name: "Saint Marina", title: "Great Martyr", note: "Of Antioch, who defeated the demon in prison and is beloved by all Orthodox." },
"07-18": { name: "Martyr Emilian of Durostorum", title: "Martyr", note: "A Slav servant who smashed pagan idols and was burned for Christ." },
"07-19": { name: "Saint Macrina", title: "Nun", note: "Elder sister of Basil and Gregory, the quiet theologian of her family." },
"07-20": { name: "Holy Prophet Elijah", title: "Prophet", note: "Who was taken up in a chariot of fire and will come again before the end." },
"07-21": { name: "Prophet Ezekiel", title: "Prophet", note: "Who saw the valley of dry bones and the glory of the Lord. Saints Simeon and John, fools for Christ, are also remembered." },
"07-22": { name: "Saint Mary Magdalene", title: "Equal to the Apostles", note: "First witness of the Resurrection, the apostle to the apostles." },
"07-23": { name: "Martyrs Trophimus and Theophilus", title: "Martyrs", note: "With thirteen companions, who suffered in Lycia under Diocletian." },
"07-24": { name: "Saint Christina", title: "Great Martyr", note: "Of Tyre, who destroyed her father idols and endured terrible tortures with joy." },
"07-25": { name: "Saint Anna", title: "Dormition", note: "The mother of the Theotokos falls asleep in the Lord, after a life of prayer." },
"07-26": { name: "Saint Paraskevi", title: "Martyr", note: "Of Rome, the Friday saint, healer of the eyes, beloved throughout the Orthodox world." },
"07-27": { name: "Saint Panteleimon", title: "Great Martyr and Healer", note: "The physician who healed in the name of Christ and is called upon for the sick." },
"07-28": { name: "Saints Prochorus, Nicanor, Timon and Parmenas", title: "Apostles", note: "Of the Seventy, among the first seven deacons of the Church." },
"07-29": { name: "Martyr Callinicus of Gangra", title: "Martyr", note: "Of Cilicia, who was shod with nails and burned for Christ." },
"07-30": { name: "Saints Silas and Silvanus", title: "Apostles", note: "Of the Seventy, companions of Saint Paul in prison and in preaching." },
"07-31": { name: "Saint Eudocimus", title: "Righteous", note: "A young officer of Cappadocia, secret in his almsgiving, radiant in holiness." },

"08-01": { name: "Procession of the Cross", title: "Feast", note: "The precious Cross is carried in procession. The Dormition Fast begins today. The seven Maccabee martyrs are also remembered." },
"08-02": { name: "Saint Stephen", title: "Translation of relics", note: "The Protomartyr and Archdeacon, whose relics were translated to Constantinople." },
"08-03": { name: "Saints Isaacius, Dalmatus and Faustus", title: "Monks", note: "The founders of the Dalmatian monastery, defenders of the faith." },
"08-04": { name: "The Seven Sleepers of Ephesus", title: "Martyrs", note: "Seven youths who slept two hundred years and awoke as witnesses to the resurrection." },
"08-05": { name: "Forefeast of the Transfiguration", title: "Forefeast", note: "The Church begins to sing of Tabor light. Martyr Eusignius is also remembered." },
"08-06": { name: "The Transfiguration", title: "Great Feast", feast: true, note: "Christ is transfigured on Mount Tabor before Peter, James and John. Fish is allowed today. Grapes and first fruits are blessed." },
"08-07": { name: "Martyr Dometius of Persia", title: "Martyr", note: "A prince who left everything to become a monk, martyred with two disciples." },
"08-08": { name: "Saint Myron of Crete", title: "Bishop", note: "A wonderworker known for his mercy. Saint Emilian the Confessor is also remembered." },
"08-09": { name: "Saint Matthias", title: "Apostle", note: "Chosen by lot to complete the Twelve in place of Judas." },
"08-10": { name: "Martyr Lawrence of Rome", title: "Archdeacon", note: "Roasted on a gridiron, who joked with his torturers and gave the Church treasures to the poor." },
"08-11": { name: "Martyr Euplus of Catania", title: "Archdeacon", note: "Who carried the Gospel into court and was beheaded for reading it aloud." },
"08-12": { name: "Martyrs Photius and Anicetus", title: "Martyrs", note: "Of Nicomedia, who suffered together under Diocletian." },
"08-13": { name: "Saint Tikhon of Zadonsk", title: "Bishop", note: "Remembered on the day of his repose, the Russian Chrysostom, teacher of the spiritual life." },
"08-14": { name: "Forefeast of the Dormition", title: "Forefeast", note: "The Church prepares for the falling asleep of the Theotokos. The Prophet Micah is also remembered." },
"08-15": { name: "The Dormition of the Theotokos", title: "Great Feast", feast: true, note: "The Mother of God falls asleep and is taken up to her Son. The summer Pascha of the Church." },
"08-16": { name: "The Holy Napkin", title: "Feast", note: "The image of Christ not made by hands, sent to King Abgar of Edessa." },
"08-17": { name: "Martyr Myron of Cyzicus", title: "Martyr", note: "A priest who suffered under Decius with unshaken faith." },
"08-18": { name: "Martyrs Florus and Laurus", title: "Martyrs", note: "Twin stonecutters, patrons of horses, who built a church with their wages and were martyred." },
"08-19": { name: "Martyr Andrew Stratelates", title: "Martyr", note: "A commander with his two thousand soldiers, who confessed Christ together." },
"08-20": { name: "Holy Prophet Samuel", title: "Prophet", note: "The last judge of Israel, who anointed David king." },
"08-21": { name: "Saint Thaddeus", title: "Apostle", note: "Of the Seventy, who brought the Holy Napkin to Edessa and preached there." },
"08-22": { name: "Martyr Agathonicus and companions", title: "Martyrs", note: "Of Nicomedia, who suffered under Maximian." },
"08-23": { name: "Leave taking of the Dormition", title: "Leave taking", note: "The Church bids farewell to the feast. Saint Irenaeus of Lyons is also remembered." },
"08-24": { name: "Saint Eutyches", title: "Hieromartyr", note: "Disciple of Saint John the Theologian, who preached for many years and was martyred." },
"08-25": { name: "Saints Bartholomew and Titus", title: "Apostles", note: "The return of Saint Bartholomew relics and Saint Titus of the Seventy, disciple of Saint Paul." },
"08-26": { name: "Martyrs Adrian and Natalia", title: "Martyrs", note: "Husband and wife of Nicomedia, who suffered together for Christ." },
"08-27": { name: "Saint Poemen the Great", title: "Monk", note: "Of Scetis, whose sayings on humility and discernment fill the desert fathers books." },
"08-28": { name: "Saint Moses the Black", title: "Monk", note: "From robber chief to gentle elder of Scetis, a witness that no sin is beyond repentance." },
"08-29": { name: "Beheading of Saint John the Baptist", title: "Strict fast day", note: "A day of strict fasting in honor of the Forerunner suffering for the truth." },
"08-30": { name: "Saints Alexander, John and Paul", title: "Patriarchs of Constantinople", note: "Three holy patriarchs remembered together for their Orthodox faith." },
"08-31": { name: "The Sash of the Theotokos", title: "Feast", note: "The placing of her precious sash in the church of Blachernae." },

"09-01": { name: "Saint Simeon Stylites", title: "Pillar dweller", note: "The first stylite, who lived atop a pillar near Antioch. The Church New Year begins today." },
"09-02": { name: "Martyr Mammas", title: "Martyr", note: "A young shepherd of Caesarea, protector of flocks, martyred under Aurelian." },
"09-03": { name: "Saint Anthimus of Nicomedia", title: "Hieromartyr", note: "A bishop beheaded in the great persecution of Diocletian." },
"09-04": { name: "Prophet Moses", title: "God seer", note: "Who received the Law on Sinai and spoke with God face to face. Saint Babylas of Antioch is also remembered." },
"09-05": { name: "Prophet Zechariah", title: "Prophet", note: "Father of Saint John the Baptist, struck mute for disbelief and loosed at his son naming." },
"09-06": { name: "Archangel Michael at Chonae", title: "Miracle", note: "The archangel turned back a flood from his church at Colossae, remembered with wonder." },
"09-07": { name: "Forefeast of the Nativity of the Theotokos", title: "Forefeast", note: "The Church begins to sing of the Virgin birth. Martyr Sozon is also remembered." },
"09-08": { name: "Nativity of the Theotokos", title: "Great Feast", feast: true, note: "The birth of the Virgin Mary to the aged Joachim and Anna, the beginning of our salvation." },
"09-09": { name: "Saints Joachim and Anna", title: "Parents of the Theotokos", note: "The righteous parents of the Virgin, honored the day after her Nativity." },
"09-10": { name: "Martyrs Menodora, Metrodora and Nymphodora", title: "Virgin Martyrs", note: "Three sisters of Bithynia, martyred together for Christ." },
"09-11": { name: "Saint Theodora of Alexandria", title: "Nun", note: "Who repented in a men monastery and was revealed a woman only after her repose." },
"09-12": { name: "Saint Autonomus", title: "Hieromartyr", note: "Bishop of Italy, martyred while serving the Liturgy. The leave taking of the Nativity of the Theotokos." },
"09-13": { name: "Forefeast of the Exaltation", title: "Forefeast", note: "The Church prepares for the lifting up of the Cross. The consecration of the Church of the Resurrection in Jerusalem is also remembered." },
"09-14": { name: "Exaltation of the Holy Cross", title: "Great Feast", feast: true, note: "The precious Cross is lifted up for all to venerate. A strict fast day." },
"09-15": { name: "Great Martyr Nicetas", title: "Great Martyr", note: "A Goth warrior who confessed Christ before his own king and was burned." },
"09-16": { name: "Great Martyr Euphemia", title: "Great Martyr", note: "Of Chalcedon, whose relics confirmed the Orthodox faith at the Fourth Council." },
"09-17": { name: "Saint Sophia and daughters", title: "Martyrs", note: "Faith, Hope and Love, martyred with their mother Sophia in Rome." },
"09-18": { name: "Saint Eumenius of Gortyna", title: "Bishop", note: "A wonderworker of Crete, known for his almsgiving and miracles." },
"09-19": { name: "Martyrs Trophimus, Sabbatius and Dorymedon", title: "Martyrs", note: "Of Antioch, who suffered together under Probus." },
"09-20": { name: "Great Martyr Eustathius", title: "Great Martyr", note: "A Roman general converted by a vision of the Cross between a stag antlers, martyred with his family." },
"09-21": { name: "Apostle Quadratus", title: "Apostle", note: "Of the Seventy, Bishop of Athens, who wrote an apology for the Christians. The leave taking of the Exaltation." },
"09-22": { name: "Saint Phocas of Sinope", title: "Hieromartyr", note: "A gardener bishop, protector of sailors, martyred under Trajan." },
"09-23": { name: "Conception of Saint John the Baptist", title: "Feast", note: "The angel announces to Zechariah that Elizabeth will bear the Forerunner." },
"09-24": { name: "Saint Thecla", title: "Equal to the Apostles", note: "The protomartyr among women, converted by Saint Paul, who preached to her last breath." },
"09-25": { name: "Saint Sergius of Radonezh", title: "Abbot", note: "Remembered on the day of his repose, the father of Russian monasticism, who blessed Russia before Kulikovo." },
"09-26": { name: "Saint John the Theologian", title: "Repose", note: "The beloved disciple falls asleep in Ephesus, the only apostle to die in peace." },
"09-27": { name: "Martyr Callistratus and companions", title: "Martyrs", note: "A soldier who converted his own guards, martyred with forty nine companions." },
"09-28": { name: "Saint Chariton the Confessor", title: "Confessor", note: "Founder of the first lavra in Palestine, who suffered for the faith under Aurelian." },
"09-29": { name: "Saint Cyriacus the Anchorite", title: "Monk", note: "Of Palestine, who lived to one hundred and nine years in prayer and stillness." },
"09-30": { name: "Saint Gregory the Illuminator", title: "Hieromartyr", note: "Enlightener of Armenia, who baptized a nation after thirteen years in a pit." },

"10-01": { name: "Protection of the Theotokos", title: "Feast", feast: true, note: "Her veil spread over the faithful at Blachernae, seen by Saint Andrew the Fool. Beloved especially in Russia." },
"10-02": { name: "Martyrs Cyprian and Justina", title: "Martyrs", note: "A sorcerer converted by a virgin prayers, who became a bishop and was martyred with her." },
"10-03": { name: "Saint Dionysius the Areopagite", title: "Hieromartyr", note: "The Athenian judge converted by Saint Paul, first Bishop of Athens." },
"10-04": { name: "Saint Hierotheus of Athens", title: "Hieromartyr", note: "Teacher of Saint Dionysius, present at the Dormition of the Theotokos." },
"10-05": { name: "Martyr Charitina", title: "Virgin Martyr", note: "Of Amisus, who sang psalms even as she was tortured." },
"10-06": { name: "Saint Thomas", title: "Apostle", note: "Who touched the wounds of the risen Christ and preached to India." },
"10-07": { name: "Martyrs Sergius and Bacchus", title: "Martyrs", note: "Two officers of the imperial guard, faithful to Christ and to each other unto death." },
"10-08": { name: "Saint Pelagia the Penitent", title: "Nun", note: "The actress of Antioch who wept her way into the desert and into sainthood." },
"10-09": { name: "Saint James, son of Alphaeus", title: "Apostle", note: "One of the Twelve, who preached in Judea and was crucified for Christ." },

      text: "Having risen from sleep, we fall down before Thee, O Blessed One, and sing unto Thee, O Mighty One, the angelic hymn: Holy, Holy, Holy art Thou, O God; through the Theotokos have mercy on us.\n\nGlory to the Father, and to the Son, and to the Holy Spirit.\n\nThou hast raised me from bed and from sleep, O Lord; enlighten my mind and my heart, and open my lips, that I may sing unto Thee, O Holy Trinity: Holy, Holy, Holy art Thou, O God; through the Theotokos have mercy on us.\n\nNow and ever, and unto ages of ages. Amen.\n\nSuddenly shall the Judge come, and the deeds of each shall be laid bare; but with fear we cry at midnight: Holy, Holy, Holy art Thou, O God; through the Theotokos have mercy on us." },
    { title: "Psalm 50",
      text: "Have mercy upon me, O God, according to Thy lovingkindness: according unto the multitude of Thy tender mercies blot out my transgressions.\nWash me throughly from mine iniquity, and cleanse me from my sin.\nFor I acknowledge my transgressions: and my sin is ever before me.\nAgainst Thee, Thee only, have I sinned, and done this evil in Thy sight: that Thou mightest be justified when Thou speakest, and be clear when Thou judgest.\nBehold, I was shapen in iniquity; and in sin did my mother conceive me.\nBehold, Thou desirest truth in the inward parts: and in the hidden part Thou shalt make me to know wisdom.\nPurge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.\nMake me to hear joy and gladness; that the bones which Thou hast broken may rejoice.\nHide Thy face from my sins, and blot out all mine iniquities.\nCreate in me a clean heart, O God; and renew a right spirit within me.\nCast me not away from Thy presence; and take not Thy Holy Spirit from me.\nRestore unto me the joy of Thy salvation; and uphold me with Thy free Spirit.\nThen will I teach transgressors Thy ways; and sinners shall be converted unto Thee.\nDeliver me from bloodguiltiness, O God, Thou God of my salvation: and my tongue shall sing aloud of Thy righteousness.\nO Lord, open Thou my lips; and my mouth shall shew forth Thy praise.\nFor Thou desirest not sacrifice; else would I give it: Thou delightest not in burnt offering.\nThe sacrifices of God are a broken spirit: a broken and a contrite heart, O God, Thou wilt not despise.\nDo good in Thy good pleasure unto Zion: build Thou the walls of Jerusalem.\nThen shalt Thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon Thine altar." },
    { title: "The Symbol of Faith",
      text: "I believe in one God, the Father Almighty, Maker of heaven and earth, and of all things visible and invisible.\n\nAnd in one Lord Jesus Christ, the Son of God, the Only begotten, begotten of the Father before all ages. Light of Light; true God of true God; begotten, not made; of one essence with the Father, by Whom all things were made; Who for us men and for our salvation came down from heaven, and was incarnate of the Holy Spirit and the Virgin Mary, and became man. And He was crucified for us under Pontius Pilate, and suffered, and was buried. And the third day He rose again, according to the Scriptures, and ascended into heaven, and sitteth at the right hand of the Father; and He shall come again with glory to judge the living and the dead; Whose Kingdom shall have no end.\n\nAnd in the Holy Spirit, the Lord, the Giver of Life, Who proceedeth from the Father; Who with the Father and the Son together is worshipped and glorified; Who spake by the prophets. In one Holy, Catholic, and Apostolic Church. I acknowledge one baptism for the remission of sins. I look for the resurrection of the dead, and the life of the world to come. Amen." },
    { title: "Morning Prayer of Saint Basil the Great",
      text: "O Lord Almighty, God of hosts and of all flesh, Who dwellest on high and lookest down upon the lowly, Who triest the heart and reins and clearly foreknowest the hidden things of men: O Light without beginning and everlasting, with Whom is no variableness neither shadow of turning: do Thou, O immortal King, accept our supplications which we now offer unto Thee from defiled lips, daring in the multitude of Thy compassions; and forgive us our transgressions, in deed, word, and thought, whether committed knowingly or in ignorance, and cleanse us from all defilement of flesh and spirit, and grant us to pass through the whole night of this present life with watchful heart and sober thought, ever awaiting the coming of the bright and manifested day of Thine Only Begotten Son, our Lord and God and Savior Jesus Christ, whereon the Judge of all shall come with glory to render unto each according to his deeds. May He not find us fallen and idle, but watchful and roused to action, and ready to enter into the joy and the divine bridal chamber of His glory, where the voice of them that feast is unceasing and the delight past telling of them that behold the ineffable beauty of Thy countenance. For Thou art the true Light that enlightenest and sanctifiest all things, and all creation doth hymn Thee unto the ages of ages. Amen." },
    { title: "Prayer to the Guardian Angel in the Morning",
      text: "O holy Angel, who standest by my wretched soul and my passionate life: forsake me not, a sinner, nor depart from me for mine intemperance. Give no place to the evil demon to have dominion over me through the violence of this mortal body. Strengthen my poor and feeble hand, and guide me into the way of salvation. Yea, O holy Angel of God, guardian and protector of my wretched soul and body: forgive me all things wherein I have offended thee all the days of my life; and if I have sinned in this past night, shelter me in this present day, and keep me from every temptation of the adversary, that I may not anger God by any sin; and pray for me unto the Lord, that He may establish me in His fear, and show me forth worthy, a servant of His goodness. Amen." },
    { title: "It Is Truly Meet",
      text: "It is truly meet to bless thee, O Theotokos, ever blessed and most pure, and the Mother of our God. More honorable than the Cherubim, and more glorious beyond compare than the Seraphim: without defilement thou gavest birth to God the Word: true Theotokos, we magnify thee." }

evening: {
  title: "Evening Prayers",

  items: [

      text: "O eternal God and King of all creation, Who hast vouchsafed me to reach even unto this hour: forgive me the sins which I have committed this day in deed, word, and thought; and cleanse, O Lord, my humble soul from all defilement of flesh and spirit. And grant me, O Lord, to pass this night in sleep in peace, that rising from my lowly bed I may please Thy most holy Name all the days of my life, and may vanquish the enemies, fleshly and bodiless, that war against me. And deliver me, O Lord, from vain thoughts that defile me, and from evil desires. For Thine is the kingdom, and the power, and the glory, of the Father, and of the Son, and of the Holy Spirit, now and ever, and unto ages of ages. Amen." },
    { title: "Evening Prayer of Saint Antiochus",

/* ---------- helpers ---------- */
function pad2(n){return (n<10?"0":"")+n;}
function dayKey(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function monthName(m){return ["January","February","March","April","May","June","July","August","September","October","November","December"][m];}
function dayName(d){return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d];}

/* ---------- Orthodox Pascha computus (Julian calendar) ---------- */
function orthodoxEaster(year){
  var a=year%19, b=year%4, c=year%7;
  var d=(19*a+15)%30, e=(2*b+4*c+6*d+6)%7;
  var day=22+d+e, mon=2; /* March, zero based */
  if(day>31){day-=31;mon=3;} /* April */
  var jul=new Date(year,mon,day);
  return new Date(jul.getTime()+13*864e5); /* Julian to Gregorian, 1900 to 2099 */
}
console.assert(dayKey(orthodoxEaster(2026))==="2026-04-12","Pascha 2026 must be April 12");
console.assert(dayKey(orthodoxEaster(2027))==="2027-05-02","Pascha 2027 must be May 2");
console.assert(dayKey(orthodoxEaster(2028))==="2028-04-16","Pascha 2028 must be April 16");

/* ---------- fasting engine ---------- */
var FAST_LEVELS={
  0:{title:"No fasting today",detail:"No fasting today. Rejoice in the Lord.",color:"#C6A13B"},
  1:{title:"Fast day",detail:"No meat, dairy or eggs. Wine and oil are allowed.",color:"#5E8C76"},
  2:{title:"Strict fast",detail:"A strict fast. No meat, dairy, eggs, oil or wine.",color:"#C0805F"},
  3:{title:"Fish allowed",detail:"Fish, wine and oil are allowed today.",color:"#9FB8C9"},
  4:{title:"Cheesefare week",detail:"Cheesefare week. No meat. Dairy, eggs, fish and wine are allowed.",color:"#E8B4A0"}
};
function mkFast(l){var f=FAST_LEVELS[l];return {level:l,title:f.title,detail:f.detail,color:f.color};}
function fastingInfo(date){
  var y=date.getFullYear(),m=date.getMonth()+1,dd=date.getDate(),dow=date.getDay();
  var k=dayKey(date), mmdd=pad2(m)+"-"+pad2(dd), weekend=(dow===0||dow===6);
  var P=orthodoxEaster(y);
  var inR=function(a,b){return k>=dayKey(a)&&k<=dayKey(b);};
  if((m===12&&dd>=25)||(m===1&&dd<=4)) return mkFast(0);            /* Nativity to Theophany eve */
  if(inR(addDays(P,-70),addDays(P,-64))) return mkFast(0);           /* Publican and Pharisee week */
  if(inR(P,addDays(P,6))) return mkFast(0);                          /* Bright Week */
  var pent=addDays(P,49);
  if(inR(pent,addDays(pent,6))) return mkFast(0);                    /* Trinity week */
  if(mmdd==="01-05") return mkFast(2);                               /* Eve of Theophany */
  if(mmdd==="08-29") return mkFast(2);                               /* Beheading of the Forerunner */
  if(mmdd==="09-14") return mkFast(2);                               /* Exaltation of the Cross */
  if(inR(addDays(P,-7),addDays(P,-1))){                              /* Holy Week */
    if(k===dayKey(addDays(P,-7))) return mkFast(3);                  /* Palm Sunday */
    var hw=mkFast(2);
    if(dow===5) hw.detail="A strict fast. Many abstain from food until the evening service.";
    return hw;
  }
  if(inR(addDays(P,-48),addDays(P,-8))){                             /* Great Lent */
    if(mmdd==="03-25") return mkFast(3);                             /* Annunciation */
    return weekend?mkFast(1):mkFast(2);
  }
  if(m===8&&dd>=1&&dd<=14){                                         /* Dormition Fast */
    if(mmdd==="08-06") return mkFast(3);                             /* Transfiguration */
    return weekend?mkFast(1):mkFast(2);
  }
  if((m===11&&dd>=15)||(m===12&&dd<=24)){                           /* Nativity Fast */
    if(mmdd==="11-21") return mkFast(3);                             /* Entry of the Theotokos */
    if(weekend) return mkFast(3);
    if(m===12&&dd>=20&&(dow===3||dow===5)) return mkFast(2);
    return mkFast(1);
  }
  var afS=addDays(P,57), afE=new Date(y,5,28);                      /* Apostles Fast */
  if(k>=dayKey(afS)&&k<=dayKey(afE)) return weekend?mkFast(3):mkFast(1);
  if(inR(addDays(P,-55),addDays(P,-49))) return mkFast(4);           /* Cheesefare week */
  if(dow===3||dow===5){
    var s=SAINTS[mmdd];
    if(s&&s.feast) return mkFast(3);
    return mkFast(1);
  }
  return mkFast(0);
}
function paschaSeason(date){
  /* returns pascha | ascensiontide | normal, with dates */
  var y=date.getFullYear(), P=orthodoxEaster(y), k=dayKey(date);
  var asc=addDays(P,39), pen=addDays(P,49);
  if(k>=dayKey(P)&&k<dayKey(asc)) return "pascha";
  if(k>=dayKey(asc)&&k<dayKey(pen)) return "ascensiontide";
  return "normal";
}
function movableFeasts(year){
  var P=orthodoxEaster(year);
  return [
    {date:addDays(P,-48),label:"Great Lent begins",kind:"fast"},
    {date:addDays(P,-7), label:"Palm Sunday",kind:"feast"},
    {date:addDays(P,-2), label:"Holy Friday",kind:"strict"},
    {date:P,             label:"Holy Pascha",kind:"feast"},
    {date:addDays(P,39), label:"Ascension",kind:"feast"},
    {date:addDays(P,49), label:"Pentecost",kind:"feast"},
    {date:addDays(P,56), label:"All Saints",kind:"feast"}
  ];
}

function applyLamp(){
  var manual=lsGet("lamp",null);

  if(manual===true||manual===false){on=manual;}
  else{
    var auto=lsGet("lamp_auto",true), h=new Date().getHours();
    on=auto&&h>=20;
  }
  document.body.classList.toggle("lamp",!!on);
  $("lampbtn").classList.toggle("on",!!on);

}

/* ==================== PRAYER RULE ==================== */
var ruleOpen={morning:true,evening:false};
var prayerLang={}; /* per item override, key sec_idx */
function defLang(){return lsGet("lang","en");}
function prayerText(en,ru,sec,idx){
  var l=prayerLang[sec+"_"+idx]||defLang();
  var src=l==="ru"?ru:en;
  if(!src)src=en;
  return {lang:l,title:src.title,text:src.text};
}
function paschalItem(l){
  var en={title:"Christ Is Risen",text:"Christ is risen from the dead, trampling down death by death, and upon those in the tombs bestowing life. (three times)"};
  var ru={title:"Христос воскресе",text:"Христос воскресе из мертвых, смертию смерть поправ, и сущим во гробех живот даровав. (трижды)"};
  return l==="ru"?ru:en;
}
function ruleItems(which,k){
  /* which: morning | evening ; returns array of {sec,idx,en,ru} */
  var season=paschaSeason(parseKey(k));
  var ub=PRAYERS.usualBeginning.items.map(function(it,i){
    return {sec:which+"ub",idx:i,en:it,ru:(PRAYERS_RU.usualBeginning.items[i]||it)};
  });
  if(season==="pascha"){
    ub=ub.map(function(o){
      if(o.en.paschaNote){
        var l=prayerLang[o.sec+"_"+o.idx]||defLang();
        var p=paschalItem(l);
        return {sec:o.sec,idx:o.idx,en:p,ru:p,paschal:true};
      }
      return o;
    });
  }else if(season==="ascensiontide"){
    ub=ub.filter(function(o){return !o.en.paschaNote;});
  }
  var main=(which==="morning"?PRAYERS.morning:PRAYERS.evening).items.map(function(it,i){
    var rsec=which==="morning"?"morn":"eve";
    var ruArr=which==="morning"?PRAYERS_RU.morning.items:PRAYERS_RU.evening.items;
    return {sec:rsec,idx:i,en:it,ru:(ruArr[i]||it)};
  });
  return ub.concat(main);
}
function ruleDone(which,k){
  var items=ruleItems(which,k);
  return items.every(function(o){return lsGet("pc_"+o.sec+"_"+o.idx+"_"+k,false);});
}
function ruleStreak(which){
  var n=0,d=new Date();
  if(!ruleDone(which,dayKey(d)))d=addDays(d,-1);
  while(ruleDone(which,dayKey(d))){n++;d=addDays(d,-1);}
  return n;
}
function renderPrayerCard(o,k){
  var t=prayerText(o.en,o.ru,o.sec,o.idx);
  var done=lsGet("pc_"+o.sec+"_"+o.idx+"_"+k,false);
  var l=t.lang;
  var h='<div class="prayer" data-sec="'+o.sec+'" data-idx="'+o.idx+'">';
  h+='<div class="prow"><button class="chk'+(done?' done':'')+'" data-chk="'+o.sec+"_"+o.idx+'">'+(done?"&#10003;":"")+'</button>'
    +'<span class="ptitle">'+esc(t.title)+'</span></div>';
  h+='<div class="ptools"><span class="seg">'
    +'<button data-pl="en" class="'+(l==="en"?'sel':'')+'">EN</button>'
    +'<button data-pl="ru" class="'+(l==="ru"?'sel':'')+'">RU</button></span></div>';
  h+='<div class="ptext"'+(done?' style="opacity:.55"':'')+'>'+esc(t.text)+'</div></div>';
  return h;
}

    };

    b.onclick=function(){
